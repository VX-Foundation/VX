name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/release/verify-source-tree.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm verify:project-creation

  framework:
    name: framework conformance and official applications
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/release/verify-source-tree.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:conformance
      - run: pnpm verify:official-apps:ci
      - run: pnpm release:artifacts

  browsers:
    name: browsers (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/release/verify-source-tree.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @vx-foundation/tests exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  clean-room:
    name: clean-room packages and generated projects
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/release/verify-source-tree.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:artifacts
      - run: pnpm release:clean-room
      - run: pnpm release:clean-room-projects
      - run: pnpm release:unstable:check
      - run: pnpm release:provenance
