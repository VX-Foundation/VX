name: RFC proposal
description: Propose a change that may require a formal RFC.
title: "[RFC idea]: "
labels: [rfc, needs-discussion]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete limitation and who it affects.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and examples
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration impact
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
